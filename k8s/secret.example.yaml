# EXAMPLE ONLY. Never apply this file with these values and never commit a filled-in
# copy. It is not listed in kustomization.yaml. Create the real secrets from generated
# values (never typed) as shown in README.md, section "Kubernetes runtime manifests".
# Every "change-me" is a placeholder for a generated value (openssl rand -hex 24);
# the admin placeholder is shorter than 16 characters, so it leaves /admin/* disabled.
---
# Used by the API Deployment and the drift CronJob: the least-privilege role project4_app.
apiVersion: v1
kind: Secret
metadata:
  name: project4-app-db
  namespace: project4-ml
  labels:
    app.kubernetes.io/part-of: project4-ml-platform
type: Opaque
stringData:
  PROJECT4_POSTGRES_HOST: project4-postgres
  PROJECT4_POSTGRES_PORT: "5432"
  PROJECT4_POSTGRES_DB: project4_ml
  PROJECT4_POSTGRES_USER: project4_app
  PROJECT4_POSTGRES_PASSWORD: change-me
---
# Used only by the in-cluster Postgres and its seed Job: the database owner.
apiVersion: v1
kind: Secret
metadata:
  name: project4-postgres-owner
  namespace: project4-ml
  labels:
    app.kubernetes.io/part-of: project4-ml-platform
type: Opaque
stringData:
  POSTGRES_USER: project4_owner
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: project4_ml
---
# X-Admin-Token for /admin/* (at least 16 characters, e.g. openssl rand -hex 32).
apiVersion: v1
kind: Secret
metadata:
  name: project4-admin
  namespace: project4-ml
  labels:
    app.kubernetes.io/name: project4-anomaly-api
    app.kubernetes.io/part-of: project4-ml-platform
type: Opaque
stringData:
  admin-token: change-me
