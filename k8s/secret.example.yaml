# Example only. Do not apply this file and do not commit a filled-in copy.
# Copy it outside git, replace the placeholder with a random token of at least
# 16 characters (for example: openssl rand -hex 32), then apply the copy:
#   kubectl apply -f /path/outside/git/project4-admin-secret.yaml
# It is intentionally not listed in kustomization.yaml. The placeholder is shorter
# than 16 characters, so applying it unchanged leaves /admin/* disabled.
apiVersion: v1
kind: Secret
metadata:
  name: project4-admin
  namespace: project4-ml
  labels:
    app.kubernetes.io/name: project4-anomaly-api
    app.kubernetes.io/part-of: project4-ml-platform
type: Opaque
stringData:
  admin-token: "change-me"
