# Hourly drift job: the active model's drift over the last 24h of batch predictions.
# With nothing scored in the window it reports not_evaluated and exits 0.
# Runs as the least-privilege role project4_app (secret project4-app-db, created outside
# git; see secret.example.yaml), from the tools image, with the same hardening as the API.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: project4-drift-job
  namespace: project4-ml
  labels:
    app.kubernetes.io/name: project4-drift-job
    app.kubernetes.io/part-of: project4-ml-platform
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: project4-drift-job
            app.kubernetes.io/part-of: project4-ml-platform
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drift-job
              image: project4-anomaly-tools:local
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - anomaly_detection.drift_job
                - --source
                - batch-predictions
                - --hours
                - "24"
              envFrom:
                - configMapRef:
                    name: project4-anomaly-api-config
                - secretRef:
                    name: project4-app-db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: runtime-logs
                  mountPath: /app/logs
          volumes:
            - name: tmp
              emptyDir: {}
            - name: runtime-logs
              emptyDir: {}
