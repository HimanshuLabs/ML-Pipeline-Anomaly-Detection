apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Secrets are created outside git (see secret.example.yaml); never listed here.
# seed-job.yaml is applied by the runbook once Postgres is ready.
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - cronjob-drift.yaml
  - networkpolicy.yaml
