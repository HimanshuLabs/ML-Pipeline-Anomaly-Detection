apiVersion: v1
kind: ConfigMap
metadata:
  name: project4-anomaly-api-config
  namespace: project4-ml
  labels:
    app.kubernetes.io/name: project4-anomaly-api
    app.kubernetes.io/part-of: project4-ml-platform
data:
  # Read by the API and every CLI (anomaly_detection.logging_config).
  LOG_LEVEL: "INFO"
  # Database mode with a read-only root filesystem: the registry and pointer live in
  # Postgres; the JSON/YAML file mirror is not written (anomaly_detection.registry).
  PROJECT4_REGISTRY_FILE_MIRROR: "false"
