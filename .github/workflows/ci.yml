name: ML Platform Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - project4-platform-foundation
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate ML platform
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Disposable database for the schema checks and the postgres-marked tests; same image
    # as compose's anomaly-postgres, on 5547 (never the real 5433/5434/5435 ports).
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: p4test
          POSTGRES_PASSWORD: project4_ci_only
          POSTGRES_DB: project4_ml
        ports:
          - 5547:5432
        options: >-
          --health-cmd "pg_isready -U p4test -d project4_ml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip>=25,<26"
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run Ruff quality gate
        run: |
          ruff check .

      - name: Run secret scan basics
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          blocked_dirs = {
              ".git",
              ".venv",
              "__pycache__",
              ".pytest_cache",
              ".ruff_cache",
              "logs",
              "mlruns",
          }

          patterns = {
              "private_key": re.compile(r"BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY"),
              "aws_access_key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "github_token": re.compile(r"gh[pousr]_[A-Za-z0-9_]{20,}"),
              "openai_key": re.compile(r"sk-[A-Za-z0-9]{20,}"),
              "slack_token": re.compile(r"xox[baprs]-[A-Za-z0-9-]{20,}"),
          }

          violations: list[str] = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if any(part in blocked_dirs for part in path.parts):
                  continue

              if path.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".joblib", ".parquet"}:
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              for label, pattern in patterns.items():
                  if pattern.search(text):
                      violations.append(f"{path}: matched {label}")

          if violations:
              print("\n".join(violations))
              raise SystemExit("Secret scan basics failed")

          print("OK: no basic secret patterns found")
          PY

      - name: Apply PostgreSQL schema twice (idempotency) and check
        env:
          PROJECT4_POSTGRES_HOST: 127.0.0.1
          PROJECT4_POSTGRES_PORT: "5547"
          PROJECT4_POSTGRES_DB: project4_ml
          PROJECT4_POSTGRES_USER: p4test
          PROJECT4_POSTGRES_PASSWORD: project4_ci_only
        run: |
          PYTHONPATH=src python -m anomaly_detection.database apply-schema
          PYTHONPATH=src python -m anomaly_detection.database apply-schema
          PYTHONPATH=src python -m anomaly_detection.database check

      - name: Run PostgreSQL integration tests
        env:
          PROJECT4_TEST_DATABASE_URL: postgresql+psycopg2://p4test:project4_ci_only@127.0.0.1:5547/project4_ml
          PROJECT4_REQUIRE_TEST_DATABASE: "1"
        run: |
          PYTHONPATH=src pytest -m postgres tests/test_database.py -q

      - name: Run training smoke tests
        run: |
          PYTHONPATH=src pytest tests/test_training_snapshot.py tests/test_training.py -q

      - name: Run source extraction smoke tests
        run: |
          PYTHONPATH=src pytest tests/test_source_extract.py -q

      - name: Run registry and baseline audit
        run: |
          PYTHONPATH=src pytest tests/test_registry.py -q
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          import yaml

          active_path = Path("configs/active_model.yaml")
          if not active_path.exists():
              raise SystemExit(f"Missing active model pointer: {active_path}")

          active = yaml.safe_load(active_path.read_text(encoding="utf-8"))
          active_version = active["active_model_version"]
          print(f"Active model version from pointer: {active_version}")

          model_dir = Path(active["artifact_path"]).parent
          metadata_path = model_dir / "metadata.json"
          baseline_path = model_dir / "baseline_stats.json"
          schema_path = model_dir / "feature_schema.json"

          for path in [metadata_path, baseline_path, schema_path]:
              if not path.exists():
                  raise SystemExit(f"Missing baseline artifact: {path}")
              print(f"OK: {path}")

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))

          feature_names = metadata["feature_names"]
          feature_baselines = baseline["feature_baselines"]

          checks = {
              "active_model_version_is_set": bool(active_version),
              "artifact_dir_matches_active_version": (
                  model_dir.name == f"model_version={active_version}"
              ),
              "metadata_model_version_matches_active": metadata["model_version"] == active_version,
              "baseline_model_version_matches_active": baseline["model_version"] == active_version,
              "schema_feature_count_matches_metadata": schema["feature_count"] == len(feature_names),
              "all_features_have_baselines": set(feature_names) == set(feature_baselines),
              "baseline_has_anomaly_rate": "baseline_anomaly_rate" in baseline,
              "baseline_has_prediction_summary": "prediction_summary" in baseline,
              "baseline_has_latency_summary": "latency_summary" in baseline,
              "label_availability_is_proxy": baseline["label_availability"] == "unlabeled_proxy_metrics",
              "snapshot_is_real_source": (
                  metadata["training_snapshot_metadata"]["snapshot_type"] == "real_source_extract"
              ),
          }

          # Segmented models: every segment, in addition to the checks above.
          if metadata.get("model_kind") == "segmented_isolation_forest":
              meta_segments = metadata.get("segments") or {}
              base_segments = baseline.get("segments") or {}
              schema_segments = schema.get("segments") or {}
              print(f"Segments: {sorted(meta_segments)}")
              checks["segments_match_across_metadata_baseline_schema"] = (
                  bool(meta_segments)
                  and set(meta_segments) == set(base_segments) == set(schema_segments)
              )
              all_segments = sorted(set(meta_segments) | set(base_segments) | set(schema_segments))
              for segment in all_segments:
                  spec = meta_segments.get(segment) or {}
                  segment_baseline = base_segments.get(segment) or {}
                  names = spec.get("feature_names") or []
                  rate = segment_baseline.get("anomaly_rate")
                  prefix = f"segment[{segment}]."
                  checks[prefix + "feature_baselines_equal_feature_names"] = bool(names) and (
                      set(segment_baseline.get("feature_baselines") or {}) == set(names)
                  )
                  checks[prefix + "feature_names_within_model"] = bool(names) and (
                      set(names) <= set(feature_names)
                  )
                  checks[prefix + "anomaly_rate_in_0_1"] = (
                      isinstance(rate, (int, float))
                      and not isinstance(rate, bool)
                      and 0 <= rate <= 1
                  )
                  checks[prefix + "row_count_matches_baseline"] = (
                      spec.get("row_count") is not None
                      and spec.get("row_count") == segment_baseline.get("row_count")
                  )

          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(f"{'OK' if passed else 'FAIL'}: {name}")

          if failed:
              raise SystemExit(f"Baseline audit failed: {failed}")

          print("OK: baseline metrics audit passed")
          PY

      - name: Run drift and rollback tests
        run: |
          PYTHONPATH=src pytest tests/test_drift.py tests/test_alerts.py tests/test_rollback.py -q

      - name: Run FastAPI and metrics tests
        run: |
          PYTHONPATH=src pytest tests/test_api.py tests/test_metrics.py tests/test_prediction_logging.py -q

      # Every postgres-marked test runs against the service; with the require flag a
      # missing URL fails the suite instead of skipping those tests.
      - name: Run full pytest suite with JUnit report
        env:
          PROJECT4_TEST_DATABASE_URL: postgresql+psycopg2://p4test:project4_ci_only@127.0.0.1:5547/project4_ml
          PROJECT4_REQUIRE_TEST_DATABASE: "1"
        run: |
          mkdir -p reports
          PYTHONPATH=src pytest -q --junitxml=reports/pytest-results.xml

      - name: Publish pytest summary
        if: always()
        run: |
          python - <<'PY_SUMMARY'
          from __future__ import annotations

          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          report_path = Path("reports/pytest-results.xml")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          if not report_path.exists():
              summary_path.write_text(
                  "## Pytest summary\n\nJUnit report was not generated.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          root = ET.parse(report_path).getroot()

          if root.tag == "testsuites":
              suites = root.findall("testsuite")
              tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
              failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
              errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
              skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
              time_seconds = sum(float(suite.attrib.get("time", 0.0)) for suite in suites)
          else:
              tests = int(root.attrib.get("tests", 0))
              failures = int(root.attrib.get("failures", 0))
              errors = int(root.attrib.get("errors", 0))
              skipped = int(root.attrib.get("skipped", 0))
              time_seconds = float(root.attrib.get("time", 0.0))

          passed = tests - failures - errors - skipped

          summary_path.write_text(
              "\n".join(
                  [
                      "## Pytest summary",
                      "",
                      f"- Total tests: `{tests}`",
                      f"- Passed: `{passed}`",
                      f"- Failed: `{failures}`",
                      f"- Errors: `{errors}`",
                      f"- Skipped: `{skipped}`",
                      f"- Runtime seconds: `{time_seconds:.2f}`",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY_SUMMARY

      - name: Upload pytest report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results
          path: reports/pytest-results.xml
          if-no-files-found: warn

      - name: Build runtime (API) Docker image
        run: |
          docker build -f docker/Dockerfile --target runtime -t project4-anomaly-api:ci .

      - name: Build tools Docker image
        run: |
          docker build -f docker/Dockerfile --target tools -t project4-anomaly-tools:ci .

      - name: Build dev Docker image
        run: |
          docker build -f docker/Dockerfile --target dev -t project4-anomaly-dev:ci .

      - name: Check image contents
        run: |
          docker run --rm --network none project4-anomaly-api:ci python -c '
          import importlib.util, sys
          from pathlib import Path
          present = [m for m in ("mlflow", "pyarrow", "pytest", "ruff", "httpx") if importlib.util.find_spec(m)]
          if present or Path("/app/sql").exists():
              sys.exit(f"runtime image must not contain {present} or /app/sql")
          import api.main
          print("OK: runtime image has no tools, tests or sql and imports api.main")'
          docker run --rm --network none project4-anomaly-tools:ci test -d /app/sql
          docker run --rm --network none project4-anomaly-tools:ci sh -c 'ls /app/sql/*.sql'

  k8s-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download and verify kubeconform v0.8.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kubeconform"
          cd "$RUNNER_TEMP/kubeconform"
          curl -fsSL -o kubeconform-linux-amd64.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz
          ./kubeconform -v
          echo "$RUNNER_TEMP/kubeconform" >> "$GITHUB_PATH"

      - name: Show kubectl client
        run: |
          if ! command -v kubectl >/dev/null; then
            echo "::error::kubectl is not installed on this runner; kubectl kustomize is required"
            exit 1
          fi
          kubectl version --client

      # Kubernetes 1.36.1: the kind node version of the live validation (runbook). Every
      # kind must have a schema: a kind without one fails the step.
      - name: Validate manifests with kubeconform (strict)
        run: |
          set -euo pipefail
          kubectl kustomize k8s/ | kubeconform -strict -summary -kubernetes-version 1.36.1 -
          kubeconform -strict -summary -kubernetes-version 1.36.1 k8s/seed-job.yaml k8s/secret.example.yaml
