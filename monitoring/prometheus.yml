global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "project4-anomaly-api"
    metrics_path: "/metrics"
    static_configs:
      # The anomaly-api service on the docker compose network.
      - targets:
          - "anomaly-api:8004"
        labels:
          service: "project4-online-anomaly-inference"
          project: "project4"
          environment: "local"
