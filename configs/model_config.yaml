model:
  name: isolation_forest
  algorithm: IsolationForest
  random_state: 42
  contamination: 0.05
  n_estimators: 200
  max_samples: auto

features:
  # Label of the 11-feature demo contract below (feature_builder, training_snapshot).
  schema_version: feature_schema_v001
  # Label stamped on models trained from real-source snapshots: the segmented model
  # spec (one IsolationForest per entity type on source_extract.SEGMENT_FEATURE_COLUMNS).
  # The snapshots themselves keep the extract label in source_extract.yaml (v002).
  real_source_schema_version: feature_schema_v003
  entity_key: entity_id
  timestamp_column: feature_timestamp
  required_numeric_features:
    - avg_cart_value_7d
    - event_count_1h
    - avg_api_latency_ms
    - fraud_score_avg
    - purchase_probability_delta
    - cart_abandonment_rate
    - campaign_roas
    - conversion_rate
    - customer_lifetime_value
    - discount_sensitivity
    - page_load_p95_ms

training:
  artifact_root: artifacts/models
  # Segmented training refuses an entity type with fewer rows than this.
  min_rows_per_segment: 30

latency_budget:
  online_prediction_p95_ms: 200
